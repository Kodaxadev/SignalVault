    <rect x="18" y="128" width="306" height="42" fill="#0E1115" stroke="#27323A"/>
    <text x="34" y="155" fill="#5FE1C0" font-family="Consolas, monospace" font-size="16" font-weight="700">ROUTE WARNING</text>
    <text x="226" y="155" fill="#B6C7CF" font-family="Consolas, monospace" font-size="14">fresh</text>
    <rect x="18" y="182" width="306" height="58" fill="#0B0D10" stroke="#27323A"/>
    <text x="34" y="208" fill="#D8E2E7" font-family="Consolas, monospace" font-size="14">Signal health</text>
