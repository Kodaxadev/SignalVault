  <g opacity=".16" stroke="#D7E3EA" stroke-width="1">
    <path d="M80 68h1040M80 118h1040M80 168h1040M80 218h1040M80 268h1040M80 318h1040"/>
    <path d="M118 48v320M218 48v320M318 48v320M418 48v320M518 48v320M618 48v320M718 48v320M818 48v320M918 48v320M1018 48v320"/>
  </g>
  <g transform="translate(760 62)">
